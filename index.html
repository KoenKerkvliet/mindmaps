<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mindmap</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23534AB7'/%3E%3Ccircle cx='16' cy='16' r='5' fill='white'/%3E%3Ccircle cx='7' cy='8' r='3' fill='%2397C459'/%3E%3Ccircle cx='25' cy='9' r='3' fill='%23EF9F27'/%3E%3Ccircle cx='24' cy='25' r='3' fill='%235DCAA5'/%3E%3Ccircle cx='8' cy='24' r='3' fill='%23ED93B1'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="top">
  <button id="btn-maps" class="btn" title="Mijn mindmaps"><i class="ti ti-menu-2"></i></button>
  <input id="title" type="text" aria-label="Titel van de mindmap" placeholder="Titel">
  <div class="seg" role="group" aria-label="Weergave">
    <button id="lay-radial" data-layout="radial">Rondom</button>
    <button id="lay-lr" data-layout="lr">Links naar rechts</button>
  </div>
  <span class="spacer"></span>
  <button id="btn-undo" class="btn" title="Ongedaan maken (Ctrl+Z)"><i class="ti ti-arrow-back-up"></i></button>
  <button id="btn-redo" class="btn" title="Opnieuw (Ctrl+Y)"><i class="ti ti-arrow-forward-up"></i></button>
  <button id="btn-fsm" class="btn" title="Kleinere letters"><i class="ti ti-text-decrease"></i></button>
  <button id="btn-fsp" class="btn" title="Grotere letters"><i class="ti ti-text-increase"></i></button>
  <button id="btn-fit" class="btn" title="Alles in beeld"><i class="ti ti-focus-2"></i></button>
  <button id="btn-colall" class="btn" title="Alles inklappen"><i class="ti ti-arrows-minimize"></i></button>
  <button id="btn-expall" class="btn" title="Alles uitklappen"><i class="ti ti-arrows-maximize"></i></button>
  <details class="menu" id="menu-export">
    <summary class="btn" title="Opslaan als bestand"><i class="ti ti-download"></i></summary>
    <div class="menu-list">
      <button id="btn-png"><i class="ti ti-photo"></i> Afbeelding (PNG)</button>
      <button id="btn-json"><i class="ti ti-file-export"></i> Bestand (JSON)</button>
    </div>
  </details>
  <button id="btn-present" class="btn primary"><i class="ti ti-presentation"></i> Presenteren</button>
  <button id="btn-full" class="btn" title="Volledig scherm"><i class="ti ti-maximize"></i></button>
</header>

<main id="stage">
  <svg id="svg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mindmap">
    <g id="world"><g id="layer-l"></g><g id="layer-n"></g></g>
  </svg>
  <div id="float">
    <button id="f-col" class="btn" title="Alles inklappen"><i class="ti ti-arrows-minimize"></i></button>
    <button id="f-exp" class="btn" title="Alles uitklappen"><i class="ti ti-arrows-maximize"></i></button>
    <button id="f-fit" class="btn" title="Alles in beeld"><i class="ti ti-focus-2"></i></button>
    <button id="f-full" class="btn" title="Volledig scherm"><i class="ti ti-maximize"></i></button>
    <button id="f-stop" class="btn primary"><i class="ti ti-pencil"></i> Bewerken</button>
  </div>
</main>

<footer id="bar"></footer>

<dialog id="dlg-maps">
  <div class="dlg-h"><h2>Mijn mindmaps</h2><button id="dlg-close" class="btn" aria-label="Sluiten"><i class="ti ti-x"></i></button></div>
  <ul id="map-list"></ul>
  <div class="dlg-f">
    <button id="btn-new" class="btn primary"><i class="ti ti-plus"></i> Nieuwe mindmap</button>
    <label class="btn"><i class="ti ti-upload"></i> Importeren<input type="file" id="file-import" accept=".json,application/json" hidden></label>
    <button id="btn-backup" class="btn"><i class="ti ti-database-export"></i> Back-up van alles</button>
  </div>
  <p class="note">Je mindmaps staan in deze browser, op dit apparaat. Wil je ze op een ander apparaat gebruiken, maak dan een back-up en importeer die daar.</p>
</dialog>

<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script src="js/app.js"></script>
</body>
</html>
